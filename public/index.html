<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sneaker Monitor</title>
<style>
  :root { --bg:#0e1014; --panel:#171a21; --line:#262b35; --text:#e7eaf0; --dim:#8a93a3; --accent:#ff5a1f; --ok:#2ecc71; --warn:#f5b301; --err:#ff4d4f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--line); }
  h1 { font-size:16px; margin:0; letter-spacing:.04em; } h1 b { color:var(--accent); }
  main { display:grid; grid-template-columns: 1fr 380px; gap:16px; padding:16px 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:0 0 10px; }
  form { display:grid; grid-template-columns: 110px 1fr; gap:8px; margin-bottom:16px; }
  form .full { grid-column: 1 / -1; }
  input, select, button { background:#0f1218; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px 10px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .mon { border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; }
  .row { display:flex; gap:8px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--dim); display:inline-block; margin-right:6px; }
  .dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .dim { color:var(--dim); font-size:12px; word-break:break-all; }
  .err { color:var(--err); font-size:12px; }
  .tag { font-size:11px; padding:1px 7px; border-radius:99px; border:1px solid var(--line); }
  .tag.snkrs { color:#fff; background:#000; } .tag.goat { color:#000; background:#e8e0d0; }
  .tag.demo { color:var(--accent); border-color:var(--accent); }
  .ev a { color:var(--text); font-weight:500; } .ev a:hover { color:var(--accent); }
  .ev.restock a, .ev.new a { color:var(--ok); } .ev.sold_out a { color:var(--err); } .ev.price a { color:var(--warn); }
  .ev.sold_out { border-left:3px solid var(--err); padding-left:8px; } .ev.sizes { border-left:3px solid var(--accent); padding-left:8px; }
  table { width:100%; border-collapse:collapse; margin-top:8px; font-size:13px; }
  td { padding:4px 6px; border-top:1px solid var(--line); } td:last-child { text-align:right; }
  .st-in_stock { color:var(--ok); } .st-sold_out { color:var(--err); } .st-upcoming { color:var(--warn); } .st-unknown { color:var(--dim); }
  .ev { padding:8px 0; border-top:1px solid var(--line); }
  .ev:first-child { border-top:0; }
  .ev .t { color:var(--dim); font-size:11px; }
  .ev.restock, .ev.new { border-left:3px solid var(--ok); padding-left:8px; }
  .ev.price { border-left:3px solid var(--warn); padding-left:8px; }
  .ev.error { border-left:3px solid var(--err); padding-left:8px; }
  a { color:var(--accent); text-decoration:none; }
  #log { max-height: 70vh; overflow:auto; }
  details summary { cursor:pointer; color:var(--dim); font-size:12px; margin-top:6px; }
</style>
</head>
<body>
<header>
  <h1>SNEAKER <b>MONITOR</b> CONTROL CENTER</h1>
  <span class="dim" id="conn">connecting…</span>
</header>
<main>
  <div>
    <section>
      <h2>New monitor</h2>
      <form id="add">
        <select name="site"><option value="snkrs">Nike SNKRS</option><option value="goat">GOAT</option><option value="demo">Demo (simulated)</option></select>
        <input name="label" placeholder="Label (e.g. Jordan 4 watch)">
        <input class="full" name="target" required placeholder="Target URL: https://www.nike.com/launch  or  https://www.goat.com/search?query=..." >
        <input name="intervalSec" type="number" min="15" value="60" title="Interval (sec)">
        <input name="keywords" placeholder="Keyword filter, comma separated (optional)">
        <input class="full" name="proxy" placeholder="Proxy (optional): http://host:port">
        <button class="primary full">Add monitor</button>
      </form>
      <h2>Monitors</h2>
      <div id="monitors"></div>
    </section>
  </div>
  <div>
    <section style="margin-bottom:16px">
      <h2>Discord webhook alerts</h2>
      <div class="row"><input id="hook" style="flex:1" placeholder="https://discord.com/api/webhooks/..."><button id="saveHook">Save</button><button id="testHook">Test</button></div>
    </section>
    <section>
      <h2>Activity</h2>
      <div id="log"></div>
    </section>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const safeUrl = (u) => /^https?:\/\//.test(u) ? esc(u) : '#';
const ago = (t) => { if (!t) return 'never'; const s = Math.round((Date.now() - t) / 1000); return s < 60 ? s + 's ago' : s < 3600 ? Math.round(s/60) + 'm ago' : new Date(t).toLocaleTimeString(); };
const api = (path, method = 'POST', body) => fetch('/api' + path, { method, headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined }).then((r) => r.json());
let state = { monitors: [], events: [] };

function render() {
  $('#monitors').innerHTML = state.monitors.map((m) => {
    const prods = Object.values(m.products || {});
    return `<div class="mon">
      <div class="row">
        <div><span class="dot ${m.running ? 'on' : ''}"></span><b>${esc(m.label)}</b> <span class="tag ${m.site}">${m.site.toUpperCase()}</span></div>
        <div>
          <button data-a="${m.running ? 'stop' : 'start'}" data-id="${m.id}">${m.running ? 'Stop' : 'Start'}</button>
          <button data-a="run" data-id="${m.id}">Check now</button>
          <button data-a="del" data-id="${m.id}">✕</button>
        </div>
      </div>
      <div class="dim">${esc(m.target)}</div>
      <div class="dim">every ${m.intervalSec}s · last check ${ago(m.lastRun)} · ${m.runs} runs · ${prods.length} items${m.keywords ? ' · filter: ' + esc(m.keywords) : ''}</div>
      ${m.lastError ? `<div class="err">${esc(m.lastError)}</div>` : ''}
      ${prods.length ? `<details open><summary>Inventory (${prods.length})</summary><table>${prods.map((p) =>
        `<tr><td><a href="${safeUrl(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a>${p.sizes?.length ? `<div class="dim">${esc(p.sizes.join(', '))}</div>` : ''}</td><td>${p.price != null ? '$' + p.price : ''}</td><td class="st-${p.status}">${esc(p.status.replace('_', ' '))}</td></tr>`).join('')}</table></details>` : ''}
    </div>`;
  }).join('') || '<div class="dim">No monitors yet. Add one above.</div>';

  $('#log').innerHTML = state.events.map((e) =>
    `<div class="ev ${e.type}"><div class="t">${new Date(e.t).toLocaleTimeString()} · ${esc(e.label)}</div>${e.url ? `<a href="${safeUrl(e.url)}" target="_blank" rel="noopener">${esc(e.message)}</a>` : esc(e.message)}</div>`
  ).join('') || '<div class="dim">No activity yet.</div>';
}

const es = new EventSource('/api/stream');
es.onopen = () => { $('#conn').textContent = 'live'; };
es.onerror = () => { $('#conn').textContent = 'reconnecting…'; };
es.onmessage = (e) => { state = JSON.parse(e.data); if (document.activeElement.id !== 'hook') $('#hook').value = state.settings.webhook || ''; render(); };

$('#add').onsubmit = async (e) => {
  e.preventDefault();
  const r = await api('/monitors', 'POST', Object.fromEntries(new FormData(e.target)));
  if (r.error) alert(r.error); else e.target.reset();
};
$('#monitors').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const { a, id } = b.dataset;
  if (a === 'del') { if (confirm('Delete monitor?')) api('/monitors/' + id, 'DELETE'); }
  else api(`/monitors/${id}/${a}`);
};
$('#saveHook').onclick = async () => {
  const r = await api('/settings', 'POST', { webhook: $('#hook').value.trim() });
  if (r.error) alert(r.error);
};
$('#testHook').onclick = async () => {
  const r = await api('/webhook/test');
  alert(r.error ? r.error : 'Test message sent');
};
setInterval(render, 15000);
</script>
</body>
</html>
